assistant:
  name: 个人简历 AI
  reading: 正在查阅个人资料…
  generating: 正在生成回答…
  newChat: 开启新对话
  close: 关闭问答助手
  welcomeTitle: 从一个问题开始
  welcomeBody: 了解他的经历、项目和成果，或粘贴职位描述。
  welcomeEvidence: 我会依据公开个人资料说明匹配证据和经验缺口，并使用你提问的语言回答。
  suggestion1: 你最近在忙什么项目？
  suggestion2: 你做的 AI 客服能帮用户做些什么？
  suggestion3: 从前端到全栈，你的经历是怎样的？
  quickAnswer1: |
    最近主要在做两个项目。

    第一个是官网 AI 客服 Agent，我主导全栈落地：前端使用 Vue 和 SSE 实现聊天交互，后端通过 TypeScript、Node.js、Mastra 接入大模型与业务接口，使用 Redis 管理会话、MySQL 保存记录，并对接飞书和 Zendesk，将自助咨询、业务查询与人工客服转接串起来。

    第二个是海外品牌达人合作管理系统，我负责前端、后端和飞书审批集成，采用 React、TypeScript、Node.js 和 PostgreSQL。系统覆盖达人建档、合同、寄样、物流、内容审核与结算，提供中文管理后台和英文达人自助端，让合作信息在同一套流程中流转。
  quickAnswer2: |
    AI 客服主要帮助用户完成商品咨询、常见问题解答、订单与物流查询，以及转接人工客服。

    价格、订单和发货信息从业务接口获取，回答前校验数据与用户权限；会话会记录用户已提供的信息和当前进度，减少重复询问。

    需要人工处理时，可以转入飞书、Zendesk 客服流程。提交工单前先展示摘要让用户确认，并处理重复提交和接口异常。常见问题直接返回标准答案，无需每次调用大模型。
  quickAnswer3: |
    我的工作是随着业务需求，从前端界面逐步扩展到后端服务、数据和业务集成。

    早期在 PatternGo 做 Canvas/Fabric.js 图形交互、可复用绘图物件和 UI 组件；在 Femometer 负责 Vue/Nuxt.js 网站，也涉及 SSR、多语言、支付接入与自动化部署。

    后来在达人合作管理系统中，除了 React 前端，还负责 Node.js/Express 后端、PostgreSQL 数据及飞书审批集成。AI 客服项目又进一步涉及 Mastra 模型接入、会话管理、业务查询和人工转接。这个过程是从实现界面，逐步延伸到把前后端、数据与业务服务连接起来。
