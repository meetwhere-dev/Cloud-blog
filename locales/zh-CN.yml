  introduction: "万云峰，字绍云，号Cloud，豫章南昌人也。生于一九九三年十月八日，今寓于杭。"
  work: "少习机巧，长耽代码，业精全栈之术，尤善前端，沉浸颇深。兼好二次元之风，蓄猫数只，日为铲屎之役；又慕刀塔之学，故自号刀斯林。"
  interests: "平生雅好，不在功名，而在器玩。凡数码新奇之物，无不留心；尤喜游海鲜之市，以低价觅遗珍，世谓之“捡漏”。暇则吸猫自娱，静听新世纪之乐，以遣尘虑。"
  resume: "查看我的个人简历 →"
  elsewhere: "若欲寻余踪迹，可访吾网上之居："
  bilibili: "哔哩哔哩"
